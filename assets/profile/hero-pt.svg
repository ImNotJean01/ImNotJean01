      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes dustFloat {
      0%, 100% { opacity: 0.1; }
      50% { opacity: 0.25; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  ]]></style>
