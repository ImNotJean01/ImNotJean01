  <desc id="desc-beyond-pt">Estratégia &amp; Sistemas: Xadrez, Fórmula 1 e criação de sistemas e narrativas como mestre de RPG de mesa (D&amp;D 5e e Ordem Paranormal — campanhas autorais de mistério investigativo, horror e loops temporais). | Referências &amp; Atmosfera: Estética precisa e contemplativa de jogos como Celeste e Hollow Knight / Silksong, ficção científica densa (Interstellar, Tenet, Blade Runner 2049, Cyberpunk: Edgerunners) e lore de Warhammer 40k. | Trilha de Foco: Rock progressivo (Polyphia), shoegaze japonês (Mass of the Fermenting Dregs), rock psicodélico (Tame Impala) e City Pop.</desc>
